[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repomind"
version = "0.1.0.dev0"
description = "Repository intelligence that runs on your machine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RepoMind contributors" }]
keywords = ["code-search", "static-analysis", "knowledge-graph", "developer-tools", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]

# Core stays deliberately small. Providers and servers are extras so that
# run modes A (MCP host), C (local model) and D (no LLM) never pay for an
# SDK they do not use. See docs/project-document.md section 9.4.
dependencies = [
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "sqlite-vec>=0.1.6,<0.2",
    # NOTE (M3 / RM-031): sentence-transformers pulls torch, roughly 2 GB.
    # That is in tension with the five-minute install target in
    # docs/project-document.md section 15. Evaluate `fastembed` (ONNX, no
    # torch) as a drop-in before RM-031 lands. Tracked as an open question.
    "sentence-transformers>=3.0,<4.0",
    "typer>=0.12,<0.16",
    "rich>=13.7,<15",
    "GitPython>=3.1,<4",
    "structlog>=24.1,<26",
    "tiktoken>=0.7,<0.9",
    "protobuf>=5.26,<7",       # SCIP index parsing
    "httpx>=0.27,<0.29",       # Ollama and OpenAI-compatible endpoints
    "platformdirs>=4.2,<5",    # ~/.repomind resolution across platforms
    "keyring>=25.0,<26",       # API keys never touch config files
]

[project.optional-dependencies]
openai = ["openai>=1.40,<2"]
anthropic = ["anthropic>=0.34,<1"]
typescript = ["tree-sitter-typescript>=0.23,<0.24"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.0,<2"]
all = ["repomind[openai,anthropic,typescript,server]"]
dev = [
    "repomind[all]",
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    "pytest-socket>=0.7,<1",   # enforces the no-network invariant
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2",
    "import-linter>=2.0,<3",
    "types-protobuf",
]

[project.scripts]
repomind = "repomind.cli.main:app"

[project.urls]
Documentation = "https://github.com/fahim-ahamed-17/repomind/tree/main/docs"
Source = "https://github.com/fahim-ahamed-17/repomind"
Issues = "https://github.com/fahim-ahamed-17/repomind/issues"

[tool.hatch.build.targets.wheel]
packages = ["repomind"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["repomind", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RET",       # return consistency
    "ARG",       # unused arguments
    "TID",       # tidy imports
    "S",         # bandit
    "T20",       # no print
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests and invariant checks
    "B008",      # Typer relies on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S", "PLR2004"]
"tests/fixtures/**" = ["ALL"]   # deliberately messy sample code

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false     # allowed, but each use needs a comment
plugins = []

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "sentence_transformers.*", "tree_sitter_*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.fixtures.*"
ignore_errors = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--disable-socket",          # network is off by default, everywhere
    "--allow-unix-socket",
]
markers = [
    "provider: needs a live LLM provider; excluded from CI",
    "slow: takes more than a few seconds",
    "scip: needs scip-python or scip-typescript on PATH",
]
filterwarnings = ["error", "ignore::DeprecationWarning:tree_sitter.*"]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["repomind"]
omit = ["repomind/cli/*", "repomind/mcp/*", "repomind/http/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ------------------------------------------------------- import-linter
# Enforces the layering in docs/design.md section 3. Without mechanical
# checking, layering decays within weeks and the documented storage
# migration path stops being real.

[tool.importlinter]
root_package = "repomind"

[[tool.importlinter.contracts]]
name = "Layers flow one way: surfaces -> core -> adapters -> store"
type = "layers"
layers = [
    "repomind.cli | repomind.mcp | repomind.http",
    "repomind.answer | repomind.analyze",
    "repomind.retrieve",
    "repomind.index",
    "repomind.llm | repomind.embed | repomind.languages",
    "repomind.store",
    "repomind.model | repomind.errors",
]

[[tool.importlinter.contracts]]
name = "Storage is isolated behind its protocols"
type = "forbidden"
source_modules = ["repomind.store.sqlite"]
forbidden_modules = [
    "repomind.retrieve",
    "repomind.answer",
    "repomind.analyze",
    "repomind.llm",
]

[[tool.importlinter.contracts]]
name = "Language packs never reach into retrieval or answering"
type = "forbidden"
source_modules = ["repomind.languages"]
forbidden_modules = ["repomind.retrieve", "repomind.answer", "repomind.analyze"]

[[tool.importlinter.contracts]]
name = "Indexing never imports an LLM provider"
type = "forbidden"
source_modules = ["repomind.index", "repomind.languages", "repomind.embed"]
forbidden_modules = ["repomind.llm"]
