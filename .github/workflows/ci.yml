name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Belt and braces alongside pytest-socket: nothing in CI should reach a
  # provider, and a stray call should fail loudly rather than bill someone.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  detect-eval-harness:
    name: Detect M6 eval harness
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f repomind/eval/qa.py ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, types, layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy repomind
      - name: Layer contracts
        run: lint-imports

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
        exclude:
          # Keep the matrix affordable: one Python per non-Linux platform.
          - { os: macos-latest, python: "3.11" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov --cov-report=term-missing -m "not provider and not scip"
      - name: Invariants
        # Run separately so a failure here is unmistakable in the log. These
        # encode product commitments, not implementation details -- see
        # AGENTS.md "Invariants".
        run: pytest tests/invariants -v

  evaluation:
    name: Retrieval quality
    runs-on: ubuntu-latest
    needs: detect-eval-harness
    # Retrieval regressions are invisible until someone notices answers got
    # worse. This turns that into a build failure -- once M6 lands the
    # golden-set harness this job needs (docs/implementation-plan.md), not
    # before: `eval.qa` not existing yet at this point in the build (M2) is
    # expected, not a regression. Gated on a real file check
    # (detect-eval-harness) rather than a milestone number or a manually
    # flipped flag, so this job starts enforcing itself the moment M6 adds
    # repomind/eval/qa.py -- no second workflow edit required.
    if: needs.detect-eval-harness.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-v1
      - name: Golden-set evaluation
        run: python -m repomind.eval.qa --fixed-corpus --fail-under 0.80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
